<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FBFD" />
    <title>Polar Command Center — Expedition Logistics &amp; Asset Management</title>
    <link rel="icon" type="image/svg+xml" href="/polar-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Integrated Polar Expedition Logistics and Asset Management System — centralised planning, cargo tracking, inventory, personnel movement and emergency response."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://polar-ai-psi.vercel.app/" />
    <meta property="og:title" content="POLAR-AI — Polar Expedition Logistics &amp; Asset Management" />
    <meta property="og:description" content="Mission command dashboard for polar stations: real-time telemetry, cargo manifests, risk intelligence, and AI-assisted operations." />
    <meta property="og:image" content="/polar-station-clean.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://polar-ai-psi.vercel.app/" />
    <meta name="twitter:title" content="POLAR-AI — Polar Expedition Logistics &amp; Asset Management" />
    <meta name="twitter:description" content="Mission command dashboard for polar stations: real-time telemetry, cargo manifests, risk intelligence, and AI-assisted operations." />
    <meta name="twitter:image" content="/polar-station-clean.jpg" />

    <!--
      Fonts are loaded from Google Fonts. If the network is unavailable (for example on
      poor venue Wi-Fi during a demo) the browser falls back to the system fonts listed
      in src/index.css, so the app still looks correct.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React attaches the whole application inside this one empty div. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
